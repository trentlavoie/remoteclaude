# Config for the dedicated tmux server rc-tmux.service runs (deploy/rc-tmux -D -f <this>).
# Deliberately NOT ~/.tmux.conf: plugins there (resurrect/continuum, hooks, auto-restore)
# must never act on the phone-launched Claude sessions, and this server must not pick up
# changes you make to your personal tmux setup.

# tmux -D already turns exit-empty off (the server stays up with zero sessions); said
# again so the intent survives someone dropping -D.
set -g exit-empty off
# enough scrollback to read a session's recent turns after `rc-tmux attach`
set -g history-limit 20000
